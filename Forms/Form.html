<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
  
    <form action="">
       <h1>Student Information</h1>
        <div>
            <label>Enter Your Name</label>
            <input type="name" id="username" placeholder="Enter Your Name">
        </div>
        <br>
        <div>
            <label>
                Enter Your Email
            </label>
            <input type="email" id="email" name="email" placeholder="@gmail.com" required>
        </div>
        <br>
        <div>
            <label>
                Enter Your Age
            </label>
            <input type="number" id="age" placeholder="Enter Your Age">
        </div>
        <br>
        <div>
            <label>Enter Your Joining Date</label>
            <input type="date" id="mydate" >
        </div>
        <br>
      <div>
  <label>Choose Gender:</label>
  <br>

  <input type="radio" id="male" name="gender" value="male">
  <label for="male">Male</label>

  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label>
</div>
<br>
<div>
  <label>Choose two Subjects:</label><br>

  <input type="checkbox" id="maths" name="subject" value="maths">
  <label for="maths">Maths</label>

  <input type="checkbox" id="science" name="subject" value="science">
  <label for="science">Science</label>

  <input type="checkbox" id="physics" name="subject" value="physics">
  <label for="physics">Physics</label>

  <input type="checkbox" id="biology" name="subject" value="biology">
  <label for="biology">Biology</label>
</div>
<br>
<div>
    <label>Upload your Document</label>
    <input type="file"  id="file">
</div>
<br>
<div>
   <button type="submit" id="submit">Submit</button>
</div>

        </form>
    </form>
    
</body>
</html>
